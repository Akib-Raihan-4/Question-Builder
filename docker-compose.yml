# Optional: run both parts with Docker instead of two terminals. Storage (B2) and the database
# (Neon) come from .env.local, exactly as with `npm run dev`.
# For a fully local Postgres: docker compose --profile localdb up
#   and set DATABASE_URL=postgres://papersmith:papersmith@postgres:5432/papersmith
services:
  web:
    build: { context: ., dockerfile: apps/web/Dockerfile }
    env_file: .env.local
    environment:
      PROCESSOR_URL: http://processor:8000
    ports: ["3000:3000"]
    volumes:
      - ./apps/web/src:/repo/apps/web/src
    depends_on: [processor]

  processor:
    build: ./services/processor
    ports: ["8000:8000"]

  postgres:
    profiles: [localdb]
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: papersmith
      POSTGRES_PASSWORD: papersmith
      POSTGRES_DB: papersmith
    ports: ["5432:5432"]
    volumes: [pg-data:/var/lib/postgresql/data]

volumes:
  pg-data:
