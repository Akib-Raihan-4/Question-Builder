# Papersmith dev stack.
# The database is Neon (DATABASE_URL in .env.local). For a fully local Postgres instead:
#   docker compose --profile localdb up   and set DATABASE_URL=postgres://papersmith:papersmith@postgres:5432/papersmith
services:
  web:
    build: { context: ., dockerfile: apps/web/Dockerfile }
    env_file: .env.local
    environment:
      PROCESSOR_URL: http://processor:8000
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: papers
      S3_ACCESS_KEY: papersmith
      S3_SECRET_KEY: papersmith-secret
    ports: ["3000:3000"]
    volumes:
      - ./apps/web/src:/repo/apps/web/src
    depends_on: [processor, minio]

  processor:
    build: ./services/processor
    ports: ["8000:8000"]

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: papersmith
      MINIO_ROOT_PASSWORD: papersmith-secret
    ports: ["9000:9000", "9001:9001"]
    volumes: [minio-data:/data]

  postgres:
    profiles: [localdb]
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: papersmith
      POSTGRES_PASSWORD: papersmith
      POSTGRES_DB: papersmith
    ports: ["5432:5432"]
    volumes: [pg-data:/var/lib/postgresql/data]

volumes:
  minio-data:
  pg-data:
